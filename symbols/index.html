  function pickRandom(source, n) {
    const copy = [...source];
    const picked = [];
    for (let i = 0; i < n && copy.length; i++) {
      const idx = Math.floor(Math.random() * copy.length);
      picked.push(copy.splice(idx, 1)[0]);
    }
    return picked;
  }

  // --- die: random face 1..6, simple pip layout ---
  const PIP_LAYOUTS = {
    1: [[50, 50]],
    2: [[30, 30], [70, 70]],
    3: [[30, 30], [50, 50], [70, 70]],
    4: [[30, 30], [70, 30], [30, 70], [70, 70]],
    5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]],
    6: [[30, 28], [70, 28], [30, 50], [70, 50], [30, 72], [70, 72]],
  };
  function drawPips(face) {
    const g = document.getElementById('pips');
    if (!g) return;
    g.innerHTML = '';
    PIP_LAYOUTS[face].forEach(([x, y]) => {
      g.appendChild(svgEl('circle', { class: 'pip', cx: x, cy: y, r: 5.5 }));
    });
  }
  drawPips(1 + Math.floor(Math.random() * 6));

  function renderField() {
    const n = Math.min(pool.length, 3 + Math.floor(Math.random() * 3));
    // unread articles first; read ones only fill the gaps (see lib/me.ts)
    let read = {};
    try { read = (JSON.parse(localStorage.getItem('pd:me') || '{}').read) || {}; } catch {}
    const keyOf = (item) => item.href.replace(/^\/|\/$/g, '');
    const unread = pool.filter((item) => !read[keyOf(item)]);
    const chosen = pickRandom(unread, n);
    if (chosen.length < n) chosen.push(...pickRandom(pool.filter((item) => read[keyOf(item)]), n - chosen.length));

    const nodesWrap = document.getElementById('nodes');
    const field = document.getElementById('field');
    const threadSvg = document.getElementById('threadSvg');
    if (!nodesWrap || !field || !threadSvg) return;
    nodesWrap.innerHTML = '';
    threadSvg.innerHTML = '';

    chosen.forEach((item, i) => {
      const a = document.createElement('a');
      a.href = item.href;
      a.className = 'node ' + (i % 2 === 0 ? 'even' : 'odd');
      a.innerHTML =
        `<img class="star" src="${STAR_SRC}" alt="">` +
        `<span class="labelwrap"><span class="cat">${item.cluster}</span><span class="title">${item.title}</span></span>`;
      nodesWrap.appendChild(a);
    });

    // Thread is drawn AFTER the real layout settles, sized to the actual
    // rendered height — never to a precomputed guess. See TZ p.7/p.9.
    requestAnimationFrame(() => {
      const fieldRect = field.getBoundingClientRect();
      const totalHeight = nodesWrap.getBoundingClientRect().height;
      const W = fieldRect.width;
      threadSvg.setAttribute('viewBox', `0 0 ${W} ${totalHeight}`);
      threadSvg.setAttribute('width', String(W));
      threadSvg.setAttribute('height', String(totalHeight));

      const defs = svgEl('defs', {});
      defs.innerHTML = `<filter id="thready" x="-30%" y="-2%" width="160%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.014" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>`;
      threadSvg.appendChild(defs);

      // Thread stays centered between the two narrow node columns
      // (each max-width:42%). Amplitude is intentionally small and fixed
      // (not proportional to width) so it can never wander into the text —
      // see TZ p.12 for the history of that bug.
      const cx = W / 2;
      const points = [];
      let y = -40, idx = 0;
      while (y < totalHeight + 40) {
        const x = cx + 40 * (idx % 2 === 0 ? 1 : -1) * (0.4 + Math.random() * 0.6);
        points.push([x, y]);
        y += 130 + Math.random() * 60;
        idx++;
      }
      points.push([cx, totalHeight + 40]);
      const mainD = pathD(points);
      const glowG = svgEl('g', { filter: 'url(#glow)' });
      const thG = svgEl('g', { filter: 'url(#thready)' });
      thG.appendChild(svgEl('path', { d: mainD, fill: 'none', stroke: '#8a1206', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.45 }));
      thG.appendChild(svgEl('path', { d: mainD, fill: 'none', stroke: '#d81f0f', 'stroke-width': 3.6, 'stroke-linecap': 'round', opacity: 0.85 }));
      thG.appendChild(svgEl('path', { d: mainD, fill: 'none', stroke: '#ff4a1c', 'stroke-width': 1.3, 'stroke-linecap': 'round', opacity: 0.75 }));
      glowG.appendChild(thG);
      threadSvg.appendChild(glowG);
    });
  }

  function rollAndReveal() {
    const dieBtn = document.getElementById('dieBtn');
    const dieSvg = document.getElementById('dieSvg');
    const rollScreen = document.getElementById('rollScreen');
    const fieldWrap = document.getElementById('fieldWrap');
    if (!dieBtn || !dieSvg || !rollScreen || !fieldWrap) return;

    dieBtn.setAttribute('disabled', '');
    dieSvg.classList.add('rolling');

    let flips = 0;
    const flipTimer = window.setInterval(() => {
      drawPips(1 + Math.floor(Math.random() * 6));
      flips++;
      if (flips > 7) window.clearInterval(flipTimer);
    }, 100);

    window.setTimeout(() => {
      window.clearInterval(flipTimer);
      rollScreen.style.display = 'none';
      fieldWrap.classList.add('shown');
      renderField();
    }, 900);
  }

  document.getElementById('dieBtn')?.addEventListener('click', rollAndReveal);
  document.getElementById('reroll')?.addEventListener('click', renderField);
})();</script>
